name: Deploy N8N

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Directory
        uses: actions/checkout@v4 

      - name: Runner working directory
        run: |
          pwd
          ls -a

      - name: Create SSH directory
        run: | 
          mkdir -p ~/.ssh 
          chmod 700 ~/.ssh

      - name: confgure SSH keys
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" >> ~/.ssh/id_ed25519 
          chmod 600 ~/.ssh/id_ed25519

      - name: Adding EC2 to known_host
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=yes \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "echo 'SSH connection successful !'"

      - name: Create project directory on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "mkdir -p ~/n8n-devops-project"

      - name: Copy deployment files to EC2 server
        run: |
          scp -r \
          deploy \
          scripts \
          deploy.sh \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/n8n-devops-project/

      - name: checking copied deployment files
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "cd ~/n8n-devops-project && ls -la"

      - name: running deployment
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

            set -e

            cd ~/n8n-devops-project
            chmod +x deploy.sh
            chmod +x scripts/*.sh

            ./deploy.sh

          EOF
